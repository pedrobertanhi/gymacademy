<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento Admin - Power Gym</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/cadastro_admin.css">
</head>
<body>

    <!-- Menu de Opções Superior -->
    <div class="menu-opcoes">
        <button id="btn-aba-cadastro" class="aba-ativa" onclick="alternarAba('cadastro')">Cadastrar Novo Usuario</button>
        <button id="btn-aba-atualizar" onclick="alternarAba('lista')">Atualizar Cadastro</button>
    </div>

    <!-- SEÇÃO 1: FORMULÁRIO (Cadastro/Edição) -->
    <div id="secao-formulario" class="cartao-cadastro">
        <div class="container-logo">
            <div class="titulo-logo">POWER</div>
            <div class="subtitulo-logo">GYM CENTER</div>
        </div>

        <h2 id="titulo-pagina">Cadastro Novo Usuário</h2>

        <form id="formulario-admin">
            <input type="hidden" id="admin-id" name="admin-id">
            
            <div class="grupo-entrada">
                <label for="nome">Nome</label>
                <div class="input-com-icone">
                    <i class="fa-solid fa-circle-user icone-esquerda"></i>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
                </div>
            </div>

            <div class="grupo-entrada">
                <label for="email">Email</label>
                <div class="input-com-icone">
                    <i class="fa-solid fa-envelope icone-esquerda"></i>
                    <input type="email" id="email" name="email" placeholder="seuemail@email.com" required>
                </div>
            </div>

            <div class="grupo-entrada" id="container-senha">
                <label for="senha">Senha</label>
                <div class="input-com-icone">
                    <i class="fa-solid fa-key icone-esquerda"></i>
                    <input type="password" id="senha" name="senha" placeholder="**********">
                    <i class="fa-solid fa-eye icone-alternar-senha" onclick="alternarVisibilidade()"></i>
                </div>
                <small id="aviso-senha" class="escondido">Deixe em branco para manter a senha atual</small>
            </div>

            <div class="grupo-entrada">
                <label for="contato">Contato</label>
                <div class="input-com-icone">
                    <i class="fa-solid fa-phone icone-esquerda"></i>
                    <span class="prefixo-pais">55</span>
                    <input type="text" id="contato" name="contato" placeholder="11 0000-0000" required>
                </div>
            </div>

            <div class="grupo-entrada">
                <label>Gênero</label>
                <div class="container-radio">
                    <i class="fa-solid fa-circle-user icone-genero"></i>
                    <div class="opcoes-radio">
                        <label class="radio-item">
                            <input type="radio" name="genero" value="masculino" checked>
                            <span>Masculino</span>
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="genero" value="feminino">
                            <span>Feminino</span>
                        </label>
                    </div>
                </div>
            </div>

            <button type="submit" id="botao-acao" class="botao-cadastrar">Cadastrar</button>
            <button type="button" id="botao-cancelar" class="botao-secundario escondido" onclick="resetarModo()">Cancelar Alteracao</button>

            <div class="link-login">
                <a href="home.html">Voltar ao Painel Principal</a>
            </div>
        </form>
    </div>

    <!-- SEÇÃO 2: TABELA DE SELEÇÃO (Escondida por padrão) -->
    <div id="secao-lista" class="secao-tabela escondido">
        <h2 style="color: #1aa3ff; margin-bottom: 10px;">Selecionar Usuario</h2>
        <p style="font-size: 12px; color: #666; margin-bottom: 20px;">Escolha um usuario da lista para atualizar os dados.</p>
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Acoes</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo">
                <!-- Conteúdo gerado pelo JavaScript -->
            </tbody>
        </table>
    </div>

    <script src="js/cadastro_admin.js"></script>
</body>
</html>

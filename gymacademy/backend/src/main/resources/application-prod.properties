# ============================================================
#  PRODUÇÃO - MySQL
#  Configure as variáveis de ambiente no servidor:
#    DB_URL, DB_USER, DB_PASS, JWT_SECRET
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gymacademy?useSSL=false&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET:TROQUE_ESTA_CHAVE_EM_PRODUCAO}
app.jwt.expiration-ms=86400000

spring.h2.console.enabled=false

logging.level.com.academia=INFO

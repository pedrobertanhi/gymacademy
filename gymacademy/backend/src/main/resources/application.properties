# ============================================================
#  SERVIDOR
# ============================================================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

spring.application.name=GymAcademy

# ============================================================
#  H2 - BANCO EM MEMÓRIA (DEV)
# ============================================================
spring.datasource.url=jdbc:h2:mem:academiadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ============================================================
#  JWT
# ============================================================
# ATENÇÃO: Em produção, substitua por variável de ambiente!
# export JWT_SECRET=sua-chave-super-secreta-de-256-bits
app.jwt.secret=gymacademy-super-secret-key-256-bits-minimum-required-2024
app.jwt.expiration-ms=86400000
# 86400000 ms = 24 horas

# ============================================================
#  CORS
# ============================================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500

# ============================================================
#  ACTUATOR (monitoramento)
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
info.app.name=GymAcademy
info.app.version=2.0.0
info.app.description=Sistema de Controle de Acesso - Academia

# ============================================================
#  LOGGING
# ============================================================
logging.level.com.academia=DEBUG
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Power Gym</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

    <!-- Alterar esse cammpo para imagem Power Gym Academy -->
    <div class="cartao-login">
        <div class="container-logo">
            <div class="titulo-logo">POWER</div>
            <div class="subtitulo-logo">GYM CENTER</div>
        </div>
        <!-- Alterar esse cammpo para imagem Power Gym Academy -->

        <h2>Faça Seu Login De Admin!</h2>

        <form action="#" method="POST">
            
            <div class="grupo-entrada">
                <i class="fa-solid fa-envelope icone-esquerda"></i>
                <input type="email" name="email" placeholder="Email" required value="admin@powergymcenter.com">
            </div>

            <div class="grupo-entrada">
                <i class="fa-solid fa-key icone-esquerda"></i>
                <input type="password" name="senha" id="senha" placeholder="Senha" required>
                <i class="fa-solid fa-eye icone-alternar-senha" onclick="alternarVisibilidade()"></i>
            </div>

            <a href="redefinirSenha.html" class="link-esqueci-senha">ESQUECI A SENHA</a>

            <button type="submit" class="botao-entrar">Entrar</button>

            <div class="link-cadastro">
                Não tem conta? <a href="cadastro.html">Fazer Cadastro.</a>
            </div>
        </form>
    </div>

    <script src="/js/login.js"></script>
</body>
</html>

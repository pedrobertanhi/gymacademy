spring.application.name=projetoacademia

# ============================================
# Servidor
# ============================================
# Porta padrão. Se 8080 estiver ocupada na sua máquina (ex.: outro serviço web),
# troque para 8081 ou outra livre.
server.port=8080

# ============================================
# MySQL — preencha com as credenciais do ambiente
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/powergym?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================
# CORS — frontend rodando em arquivo local ou outro host
# (configurar em backend/src/main/java/.../config/CorsConfig.java)
# ============================================

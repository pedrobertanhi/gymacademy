spring.application.name=projetoacademia

# ============================================
# Servidor
# ============================================
server.port=8081

# ============================================
# H2 Database (Banco em Memória)
# ============================================
# O nome do banco será 'powergym'
spring.datasource.url=jdbc:h2:mem:powergym
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ============================================
# Configurações do Console do H2 (Navegador)
# ============================================
# Permite acessar o banco de dados direto pelo navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Admin - Power Gym Center</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>

    <div class="cartao-cadastro">
        <img src="assets/logoPowerGymCenter.svg" alt="Power Gym Center" class="logo-svg logo-grande">

        <h2>Faça Seu Cadastro De Admin.</h2>

        <form id="form-cadastro" novalidate>

            <div class="grupo-entrada">
                <label for="nome">Nome</label>
                <div class="input-com-icone">
                    <i class="fa-solid fa-circle-user icone-esquerda"></i>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
                </div>
            </div>

            <div class="grupo-entrada">
                <label for="email">Email</label>
                <div class="input-com-icone">
                    <i class="fa-solid fa-envelope icone-esquerda"></i>
                    <input type="email" id="email" name="email" placeholder="seuemail@email.com" required>
                </div>
            </div>

            <div class="grupo-entrada">
                <label for="senha">Senha</label>
                <div class="input-com-icone">
                    <i class="fa-solid fa-key icone-esquerda"></i>
                    <input type="password" id="senha" name="senha" placeholder="**********" required>
                    <i class="fa-solid fa-eye icone-alternar-senha" onclick="alternarVisibilidadeSenha(this)"></i>
                </div>
            </div>

            <div class="grupo-entrada">
                <label for="contato">Contato</label>
                <div class="input-com-icone">
                    <i class="fa-solid fa-phone icone-esquerda"></i>
                    <span class="prefixo-pais">+55</span>
                    <input type="text" id="contato" name="contato" placeholder="(11) 0000-0000" required>
                </div>
            </div>

            <div class="grupo-entrada">
                <label>Gênero</label>
                <div class="container-radio">
                    <i class="fa-solid fa-circle-user icone-genero"></i>
                    <div class="opcoes-radio">
                        <label class="radio-item">
                            <input type="radio" name="genero" value="masculino" checked>
                            <span>Masculino</span>
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="genero" value="feminino">
                            <span>Feminino</span>
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="genero" value="nenhum">
                            <span>Não informar</span>
                        </label>
                    </div>
                </div>
            </div>

            <div id="erro-cadastro" class="erro-login" hidden></div>

            <button type="submit" class="botao-cadastrar">Cadastrar</button>

            <div class="link-login">
                Já tem conta? <a href="login.html">Fazer Login.</a>
            </div>
        </form>
    </div>

    <script src="js/shared.js" defer></script>
    <script src="js/cadastro.js" defer></script>
</body>
</html>
